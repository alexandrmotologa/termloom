<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="loomGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="loomGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Terminal Window Chrome -->
  <rect x="56" y="56" width="400" height="400" rx="32" fill="#0B0F19" fill-opacity="0.75" stroke="#1E293B" stroke-width="2" />
  <circle cx="96" cy="94" r="9" fill="#EF4444" />
  <circle cx="126" cy="94" r="9" fill="#F59E0B" />
  <circle cx="156" cy="94" r="9" fill="#10B981" />
  <line x1="56" y1="130" x2="456" y2="130" stroke="#1E293B" stroke-width="2" />

  <!-- Terminal Title -->
  <text x="256" y="99" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">TERMLOOM</text>

  <!-- Loom Threads (Vertical warp lines) -->
  <line x1="170" y1="150" x2="170" y2="420" stroke="url(#loomGrad1)" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="210" y1="150" x2="210" y2="420" stroke="url(#loomGrad1)" stroke-width="2.5" />
  <line x1="250" y1="150" x2="250" y2="420" stroke="url(#loomGrad1)" stroke-width="2" stroke-dasharray="8,4" />
  <line x1="290" y1="150" x2="290" y2="420" stroke="url(#loomGrad2)" stroke-width="2.5" />
  <line x1="330" y1="150" x2="330" y2="420" stroke="url(#loomGrad2)" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="370" y1="150" x2="370" y2="420" stroke="url(#loomGrad2)" stroke-width="2" stroke-dasharray="4,6" />

  <!-- Weaving Terminal Prompt (Greater Than Chevron) -->
  <path d="M 140 200 L 230 270 L 140 340" fill="none" stroke="url(#glowGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Weaving Cursor / Warp Shuttle -->
  <line x1="260" y1="340" x2="350" y2="340" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" filter="url(#subtleGlow)" />

  <!-- Intersecting Wave Warp (The Loom effect) -->
  <path d="M 120 270 Q 200 220 280 270 T 440 270" fill="none" stroke="#A855F7" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="4,6" />
</svg>
