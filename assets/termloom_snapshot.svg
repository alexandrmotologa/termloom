<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 879 600" width="100%" height="100%">
  <style>
    :root {
      --bg: #1e1e2e;
      --fg: #cdd6f4;
      --cursor: #f5e0dc;
    }
    text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 14px;
      dominant-baseline: alphabetic;
      white-space: pre;
    }
    .terminal-bg {
      fill: var(--bg);
    }
    .frame { visibility: visible; }
    @media (hover: hover) {
      svg:hover .frame {
        animation-play-state: paused !important;
      }
    }
    .window-frame {
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.65));
    }
  </style>

  <!-- Window Frame -->
  <rect class="window-frame" width="879" height="600" rx="12" fill="#1e1e2e" stroke="#334155" stroke-width="1.5" />
  <!-- Traffic Light Controls -->
  <circle cx="20" cy="19" r="6" fill="#ef4444" />
  <circle cx="38" cy="19" r="6" fill="#f59e0b" />
  <circle cx="56" cy="19" r="6" fill="#10b981" />
  <!-- Title -->
  <text x="439.5" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">termloom</text>
  <line x1="0" y1="38" x2="879" y2="38" stroke="#334155" stroke-width="1" />
